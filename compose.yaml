services:
  api:
    build: .
    command: api
    environment:
      API_APP: ${API_APP:-app.api:app}
      LLAMA_BASE_URL: ${LLAMA_BASE_URL:-http://host.docker.internal:8080/v1}
      LLAMA_MODEL: ${LLAMA_MODEL:-local}
      LLM_PROVIDER: ${LLM_PROVIDER:-llama}
      LLAMA_TIMEOUT_SECONDS: ${LLAMA_TIMEOUT_SECONDS:-45}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./data:/app/data

  ui:
    build: .
    command: ui
    environment:
      API_BASE_URL: http://api:8000
    ports:
      - "${UI_PORT:-8501}:8501"
    depends_on:
      - api
