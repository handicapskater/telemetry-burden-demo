name: CI
on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Import application modules
        run: |
          python - <<'PY'
          import importlib
          import pkgutil
          import app
          for module in pkgutil.iter_modules(app.__path__):
              importlib.import_module(f"app.{module.name}")
          PY
      - name: Validate schema and available local data
        run: python scripts/check_schema.py
      - name: Run pytest
        run: |
          if find tests -name 'test_*.py' -print -quit 2>/dev/null | grep -q .; then
            python -m pytest -v
          else
            echo 'No test files yet; integration branches will add them.'
          fi
